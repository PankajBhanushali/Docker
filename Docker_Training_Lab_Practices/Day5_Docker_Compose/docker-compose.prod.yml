# Production configuration for Docker Compose
version: '3.9'

services:
  web-api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - LOG_LEVEL=Warning
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    environment:
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 -c shared_preload_libraries=pg_stat_statements
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1024M
        reservations:
          cpus: '1'
          memory: 512M

  redis:
    command: redis-server --loglevel warning --appendonly yes --requirepass RedisPassword@123
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  nginx:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
